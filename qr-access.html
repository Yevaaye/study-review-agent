     <li>扫码，或手动输入 <strong>http://192.168.31.178</strong></li>
     <li>仍打不开，访问 <strong>http://192.168.31.178/api/health</strong>，能出文字就说明网络是通的</li></ol>
    <div class="warn"><b>常见原因：</b>手机顶部显示 <b>5G</b> 而没连 WiFi 时，访问 <b>192.168.x.x</b> 这种内网地址一定打不开——数据走的是移动网络，到不了你电脑。</div>
